<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản Lý Xác Nhận | Thiệp Mời Lễ Tốt Nghiệp</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    :root {
      --cream: #fef5f5;
      --paper: #fffcfc;
      --ink: #3d2a2e;
      --muted: #8b6b73;
      --pink: #e89ab8;
      --light-pink: #f5d9e6;
      --dark-pink: #c75a7e;
      --line: #e8c5d0;
      --shadow: 0 12px 40px rgba(200, 100, 130, 0.08);
      --success: #4caf50;
      --warning: #ff9800;
      --danger: #f44336;
    }

    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: linear-gradient(135deg, #fffbfc 0%, #fef0f5 50%, #fae6f0 100%);
      color: var(--ink);
      font-family: "Be Vietnam Pro", sans-serif;
      overflow-x: hidden;
    }

    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .admin-header {
      background: rgba(255, 252, 254, 0.95);
      border: 1px solid rgba(232, 154, 184, 0.25);
      border-radius: 24px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .admin-header h1 {
      font-family: "Playfair Display", serif;
      font-size: 36px;
      color: var(--dark-pink);
      margin: 0 0 10px;
    }

    .admin-header p {
      color: var(--muted);
      margin: 0;
      font-size: 14px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: rgba(255, 252, 254, 0.95);
      border: 1px solid rgba(232, 154, 184, 0.25);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .stat-card .stat-value {
      font-size: 32px;
      font-weight: 600;
      margin: 10px 0;
      color: var(--dark-pink);
    }

    .stat-card .stat-label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat-attending { --color: var(--success); }
    .stat-not-attending { --color: var(--danger); }
    .stat-maybe { --color: var(--warning); }
    .stat-total { --color: var(--pink); }

    .stat-card.stat-attending .stat-value { color: var(--success); }
    .stat-card.stat-not-attending .stat-value { color: var(--danger); }
    .stat-card.stat-maybe .stat-value { color: var(--warning); }
    .stat-card.stat-total .stat-value { color: var(--pink); }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: 0.25s;
      font-family: "Be Vietnam Pro", sans-serif;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--pink), var(--dark-pink));
      color: #fff;
      box-shadow: 0 8px 20px rgba(200, 90, 126, 0.25);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(200, 90, 126, 0.35);
    }

    .btn-secondary {
      background: var(--cream);
      color: var(--dark-pink);
      border: 1px solid var(--line);
    }

    .btn-secondary:hover {
      background: var(--light-pink);
    }

    .table-wrapper {
      background: rgba(255, 252, 254, 0.95);
      border: 1px solid rgba(232, 154, 184, 0.25);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead {
      background: linear-gradient(135deg, #f5d9e6, #fae6f0);
      border-bottom: 2px solid var(--line);
    }

    th {
      padding: 14px;
      text-align: left;
      font-weight: 600;
      color: var(--dark-pink);
    }

    td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      color: var(--ink);
    }

    tr:hover {
      background: rgba(232, 154, 184, 0.05);
    }

    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 11px;
    }

    .status-attending {
      background: rgba(76, 175, 80, 0.2);
      color: var(--success);
    }

    .status-not-attending {
      background: rgba(244, 67, 54, 0.2);
      color: var(--danger);
    }

    .status-maybe {
      background: rgba(255, 152, 0, 0.2);
      color: var(--warning);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .search-box {
      margin-bottom: 20px;
    }

    .search-box input {
      width: 100%;
      max-width: 300px;
      padding: 10px 14px;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      font-family: "Be Vietnam Pro", sans-serif;
      font-size: 13px;
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--pink);
      box-shadow: 0 0 0 3px rgba(232, 154, 184, 0.15);
    }

    .wish-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .wish-modal.active {
      display: flex;
    }

    .wish-modal-content {
      background: #fff;
      border-radius: 16px;
      padding: 30px;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .wish-modal h3 {
      color: var(--dark-pink);
      margin-top: 0;
      font-family: "Playfair Display", serif;
    }

    .wish-modal p {
      color: var(--muted);
      line-height: 1.6;
      margin: 10px 0;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: 0;
      border: 0;
      font-size: 24px;
      cursor: pointer;
      color: var(--muted);
    }

    @media (max-width: 768px) {
      .admin-header h1 { font-size: 24px; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .controls { flex-direction: column; }
      table { font-size: 11px; }
      th, td { padding: 8px; }
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="admin-header">
      <h1>📊 Quản Lý Xác Nhận</h1>
      <p>Lễ Tốt Nghiệp | Vũ Kiều Oanh · 03/10/2026</p>
    </div>

    <div class="stats-grid">
      <div class="stat-card stat-total">
        <div class="stat-label">Tổng Xác Nhận</div>
        <div class="stat-value" id="statTotal">0</div>
      </div>
      <div class="stat-card stat-attending">
        <div class="stat-label">Sẽ Tham Dự 🎉</div>
        <div class="stat-value" id="statAttending">0</div>
      </div>
      <div class="stat-card stat-maybe">
        <div class="stat-label">Chưa Chắc 🥺</div>
        <div class="stat-value" id="statMaybe">0</div>
      </div>
      <div class="stat-card stat-not-attending">
        <div class="stat-label">Không Tham Dự 😭</div>
        <div class="stat-value" id="statNotAttending">0</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="exportBtn">📥 Xuất Excel</button>
      <button class="btn btn-secondary" id="clearBtn">🗑️ Xóa Dữ Liệu</button>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Tìm kiếm theo tên...">
      </div>
    </div>

    <div class="table-wrapper">
      <table id="dataTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Họ và Tên</th>
            <th>Xác Nhận</th>
            <th>Ngày Nhận</th>
            <th>Thời Gian Gửi</th>
            <th>Lời Chúc</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td colspan="6" class="empty-state">
              <div class="empty-state-icon">📭</div>
              <p>Chưa có xác nhận nào cả</p>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal hiển thị lời chúc -->
  <div class="wish-modal" id="wishModal">
    <div class="wish-modal-content">
      <button class="close-btn" onclick="closeWishModal()">✕</button>
      <h3 id="wishName"></h3>
      <p><strong>Xác Nhận:</strong> <span id="wishStatus"></span></p>
      <p><strong>Ngày Nhận:</strong> <span id="wishReceived"></span></p>
      <p><strong>Thời Gian Gửi:</strong> <span id="wishTime"></span></p>
      <hr style="border: none; border-top: 1px solid var(--line); margin: 15px 0;">
      <p><strong>Lời Chúc:</strong></p>
      <p id="wishContent" style="background: var(--cream); padding: 15px; border-radius: 8px; font-style: italic;"></p>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "graduation-wishes";

    function loadData() {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      updateStats(data);
      renderTable(data);
    }

    function updateStats(data) {
      const total = data.length;
      const attending = data.filter(d => d.attendance === "Có tham dự").length;
      const maybe = data.filter(d => d.attendance === "Chưa chắc").length;
      const notAttending = data.filter(d => d.attendance === "Không tham dự").length;

      document.getElementById("statTotal").textContent = total;
      document.getElementById("statAttending").textContent = attending;
      document.getElementById("statMaybe").textContent = maybe;
      document.getElementById("statNotAttending").textContent = notAttending;
    }

    function renderTable(data, searchTerm = "") {
      const tableBody = document.getElementById("tableBody");
      const filtered = data.filter(d =>
        d.guest.toLowerCase().includes(searchTerm.toLowerCase())
      );

      if (filtered.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="6" class="empty-state">
              <div class="empty-state-icon">🔍</div>
              <p>Không tìm thấy kết quả nào</p>
            </td>
          </tr>
        `;
        return;
      }

      tableBody.innerHTML = filtered.map((item, idx) => {
        const statusClass = {
          "Có tham dự": "status-attending",
          "Chưa chắc": "status-maybe",
          "Không tham dự": "status-not-attending"
        }[item.attendance] || "";

        const statusText = {
          "Có tham dự": "🎉 Có tham dự",
          "Chưa chắc": "🥺 Chưa chắc",
          "Không tham dự": "😭 Không tham dự"
        }[item.attendance] || item.attendance;

        return `
          <tr>
            <td>${idx + 1}</td>
            <td><strong>${escapeHtml(item.guest)}</strong></td>
            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
            <td>${item.received || "—"}</td>
            <td><small>${item.createdAt}</small></td>
            <td>
              ${item.wish ? `<button class="btn btn-secondary" onclick="showWish('${escapeHtml(item.guest)}', '${escapeHtml(item.attendance)}', '${escapeHtml(item.received)}', '${escapeHtml(item.createdAt)}', '${escapeHtml(item.wish)}')">Xem</button>` : "—"}
            </td>
          </tr>
        `;
      }).join("");
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function showWish(name, status, received, time, wish) {
      const modal = document.getElementById("wishModal");
      document.getElementById("wishName").textContent = name;
      document.getElementById("wishStatus").textContent = {
        "Có tham dự": "🎉 Có tham dự",
        "Chưa chắc": "🥺 Chưa chắc",
        "Không tham dự": "😭 Không tham dự"
      }[status] || status;
      document.getElementById("wishReceived").textContent = received || "—";
      document.getElementById("wishTime").textContent = time;
      document.getElementById("wishContent").textContent = wish || "(Không có lời chúc)";
      modal.classList.add("active");
    }

    function closeWishModal() {
      document.getElementById("wishModal").classList.remove("active");
    }

    document.getElementById("exportBtn").addEventListener("click", () => {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      if (data.length === 0) {
        alert("Không có dữ liệu để xuất!");
        return;
      }

      let csv = "Họ và Tên,Xác Nhận,Ngày Nhận,Thời Gian Gửi,Lời Chúc\n";
      data.forEach(item => {
        csv += `"${item.guest}","${item.attendance}","${item.received || ""}","${item.createdAt}","${item.wish || ""}"\n`;
      });

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `xac-nhan-tham-du-${new Date().toLocaleDateString("vi-VN")}.csv`;
      link.click();
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      if (confirm("Bạn chắc chắn muốn xóa tất cả dữ liệu? Hành động này không thể hoàn tác!")) {
        localStorage.removeItem(STORAGE_KEY);
        loadData();
        alert("Dữ liệu đã được xóa!");
      }
    });

    document.getElementById("searchInput").addEventListener("input", (e) => {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      renderTable(data, e.target.value);
    });

    // Close modal when clicking outside
    document.getElementById("wishModal").addEventListener("click", (e) => {
      if (e.target === document.getElementById("wishModal")) {
        closeWishModal();
      }
    });

    // Load data on page load and every 2 seconds
    loadData();
    setInterval(loadData, 2000);
  </script>
</body>
</html>
